name: Release

on:
  push:
    tags: ['show-your-work--v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#show-your-work--}"
          # The notes are the summary of the version's own commit ("0.6.3: ..."),
          # not of whatever commit happens to be last.
          subject="$(git log --format=%s --grep="^${version#v}: " -1 "$TAG")"
          # A version not on releases yet (Stable) is out on Latest only: a pre-release.
          git fetch --quiet origin releases
          if git merge-base --is-ancestor "$TAG" origin/releases; then stage=--latest; else stage=--prerelease; fi
          gh release create "$TAG" --title "$version" --notes "${subject#*: }" --verify-tag "$stage"
