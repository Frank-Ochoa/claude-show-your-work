name: Release

on:
  push:
    tags: ['show-your-work--v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#show-your-work--}"
          subject="$(git log -1 --format=%s "$TAG")"
          gh release create "$TAG" --title "$version" --notes "${subject#*: }" --verify-tag
