name: Idea or request
description: Something you'd like show-your-work to do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it help you with?
      description: The situation you're in when you'd use it.
